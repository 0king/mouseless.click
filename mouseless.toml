# Mouseless application configuration.
#
# Installed as /etc/mouseless/mouseless.toml and read by `mouselessd`, the
# `mouseless` CLI, and `mouseless-settings`. This file holds application-level
# constants (paths, endpoints, device names, timeouts, deep-link scheme, and
# appearance fallbacks). User-facing settings remain in the daemon-owned
# config.yaml, which is edited by the settings app.
#
# Lookup order (highest precedence first):
#   1. --config PATH (daemon, CLI, settings app)
#   2. MOUSELESS_CONFIG
#   3. /etc/mouseless/mouseless.toml
#   4. built-in defaults
#
# A missing installed file falls back to the built-in defaults. A file named
# explicitly with --config/MOUSELESS_CONFIG is required and invalid content is
# reported instead of being ignored. See docs section "Application config" in
# README.md. Restart the affected process after editing; the file is read once
# at startup.

[paths]
# Daemon state directory; systemd StateDirectory overrides it for mouselessd.
state_dir = "/var/lib/mouseless"
# Last-applied user settings, relative to state_dir.
config_file = "config.yaml"
# Overlay Unix socket. The systemd unit creates /run/mouseless via
# RuntimeDirectory; changing this path requires a matching unit/permissions
# arrangement that the desktop user and the GNOME extension can reach.
socket = "/run/mouseless/mouselessd.sock"
# Kanata main config checked by the settings app before applying an include.
# The installer/apply script still edit this path; change it only together
# with platform/kanata/apply-kanata-config.sh.
kanata_main_config = "/etc/kanata/unicfg.kbd"
# uinput device used for synthetic mouse events.
uinput = "/dev/uinput"
# Kernel listing used by `mouseless --list-input-devices`.
input_devices = "/proc/bus/input/devices"

[kanata]
# Loopback TCP endpoint (kanata -p HOST:PORT). The installer regenerates the
# kanata drop-in from this value; re-run install-system.sh after changing it.
address = "127.0.0.1:7070"
# Connect timeout for the daemon and settings app.
connect_timeout_ms = 2000
# Query timeout for CLI layer operations.
query_timeout_ms = 3000
# Delay before retrying an unavailable kanata TCP connection.
reconnect_backoff_ms = 1000
# Include file name generated by the config engine; must match the
# `(include "...")` line in kanata_main_config (installer uses mouseless.kbd).
include_name = "mouseless.kbd"

[daemon]
# Idle TCP read timeout; also polls the overlay socket.
idle_read_timeout_ms = 500
# Session read timeout; grabbed keys must be polled every few milliseconds.
session_read_timeout_ms = 2
# EBUSY grab retry budget.
grab_retry_attempts = 40
grab_retry_delay_ms = 50
# Cursor refresh budget before a click.
cursor_query_timeout_ms = 100
# Shift tap window for monitor switching.
monitor_switch_tap_ms = 200
# Fixed physics tick for custom free mode.
free_mode_tick_ms = 8
# Closed-loop movement (see ARCHITECTURE.md: half-error law). Changing these
# can strand or oscillate clicks; keep the defaults unless you are tuning on
# real hardware.
move_max_step_px = 64
move_damping_divisor = 2
move_min_step_px = 2
move_tolerance_px = 2
move_max_iterations = 256
move_max_stalled_steps = 8
move_settle_timeout_ms = 20
move_settle_poll_ms = 2
# Debug logging (the MOUSELESS_DEBUG_LAYOUT/MOVE environment variables also work).
debug_layout = false
debug_move = false

[devices]
# The installer writes these into the kanata defcfg
# (`linux-output-device-name` / `linux-dev-names-exclude`); re-run
# install-system.sh after changing them, or kanata will not see/exclude the
# right devices.
kanata_output_name = "kanata-mouseless"
mouse_name = "mouseless-mouse"
# Sonuscape USB vendor id (0x736e).
vendor_id = 0x736e

[layers]
# Neutral layer restored on exit.
base = "lyr-base"

[deep_link]
# URL scheme for `mouseless://...` style links. Changing it requires
# re-running platform/install-system.sh so the desktop handler is regenerated.
scheme = "mouseless"
# Settings binary spawned by `mouseless settings` (MOUSELESS_SETTINGS overrides).
# Changing it also requires updating platform/desktop/mouseless-settings.desktop.
settings_binary = "mouseless-settings"

[ui]
# GTK application id, also the single-instance key.
app_id = "click.mouseless.Settings"

[appearance]
# Fallback appearance when config.yaml has no appearance section. Once the
# settings app saves config.yaml, that document is the source of truth.
grid_color = "#d4de04"
grid_opacity = 0.2
label_color = "#ebe9e8"
highlight_color = "#ffb22c"

[ipc]
# One-shot daemon client request timeout (reload/status/save/update).
client_timeout_ms = 1000
