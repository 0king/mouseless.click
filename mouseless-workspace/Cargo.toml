[workspace]
resolver = "2"
members = [
    "crates/mouseless-core",
    "crates/mouseless-config",
    "crates/mouseless-state",
    "crates/mouseless-ipc",
    "crates/mouseless-kbd",
    "crates/mouseless-mouse",
    "crates/mouseless-overlay",
    "crates/mouseless-daemon",
    "crates/mouseless-cli",
    "crates/mouseless-gtk",
]

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "1"
thiserror = "2"
libc = "0.2"
mouseless-core = { path = "crates/mouseless-core" }
mouseless-config = { path = "crates/mouseless-config" }
mouseless-state = { path = "crates/mouseless-state" }
mouseless-ipc = { path = "crates/mouseless-ipc" }
mouseless-kbd = { path = "crates/mouseless-kbd" }
mouseless-mouse = { path = "crates/mouseless-mouse" }
mouseless-overlay = { path = "crates/mouseless-overlay" }
mouseless-cli = { path = "crates/mouseless-cli" }
