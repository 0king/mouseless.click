# Mouseless system user and groups (install as
# /usr/lib/sysusers.d/mouseless.conf).
#
# The daemon runs as `mouselessd` with primary group `mouseless`:
# - `/dev/uinput` is group-owned by `mouseless` via the udev rule;
# - the overlay socket directory is 0770 `mouselessd:mouseless`;
# - supplementary group `input` is required for the evdev temp-grab of
#   kanata's output.
#
# The desktop user must also be in `mouseless` to connect to the overlay
# socket. `platform/install-system.sh` adds $SUDO_USER when needed; use
# --no-group-add to manage that membership yourself.
#
# `g mouseless -` is idempotent: an existing group keeps its GID.
# `-:mouseless` makes `mouseless` the user's primary group and does not
# create a separate `mouselessd` group.

g mouseless -
u mouselessd -:mouseless "Mouseless daemon" / /usr/sbin/nologin
m mouselessd input
