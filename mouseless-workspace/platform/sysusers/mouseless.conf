# Mouseless system user and groups (install as
# /usr/lib/sysusers.d/mouseless.conf).
#
# Least-privilege split (never collapse these groups):
# - `mouseless`  client group: overlay socket only (0770 /run/mouseless).
#                The desktop user is a member; this must NOT grant any
#                input-device access.
# - `uinput`     /dev/uinput write access (0660). Members: `mouselessd`, plus
#                `kanata-svc` (the kanata drop-in re-asserts it idempotently).
#                Never a human account.
# - `input`      evdev read/temp-grab of kanata's output. Members:
#                `mouselessd`, plus `kanata-svc` (drop-in, idempotent).
#                Never a human account.
#
# The daemon runs as `mouselessd` with primary group `mouseless` (socket dir
# ownership) and supplementary groups `input` + `uinput`.
#
# `platform/install-system.sh` adds only $SUDO_USER to `mouseless`; it never
# adds a human to `input`/`uinput`. Use --no-group-add to manage membership
# yourself.
#
# `g <group> -` is idempotent: an existing group keeps its GID, so reusing
# kanata's `uinput` group does not disturb other members, and the standard
# `input` group is created only if the host somehow lacks it.
# `-:mouseless` makes `mouseless` the user's primary group and does not
# create a separate `mouselessd` group.

g mouseless -
g input -
g uinput -
u mouselessd -:mouseless "Mouseless daemon" / /usr/sbin/nologin
m mouselessd input
m mouselessd uinput
