# kanata.service drop-in for Mouseless (plan §2.3, audit W2).
#
# Install as /etc/systemd/system/kanata.service.d/mouseless.conf, then
# `systemctl daemon-reload && systemctl restart kanata.service`.
#
# - TCP on localhost only (LayerChange subscription + ChangeLayer control).
# - Emergency chord LCtrl+Space+Esc: on Linux kanata raises SIGTERM directly
#   and ignores the exit code, so RestartForceExitStatus=SIGTERM is required
#   (Restart=on-failure alone does NOT restart on SIGTERM).
# - NEVER add `forceful-exit-code` to defcfg (invalid option: parse error).
# - No `danger-enable-cmd`, no cmd_allowed binary (audit W1: no cmd anywhere).

[Service]
ExecStart=
ExecStart=/usr/local/bin/kanata --cfg /etc/kanata/kanata.kbd -p 127.0.0.1:7070 --emergency-exit-code 1
Restart=on-failure
RestartForceExitStatus=SIGTERM
