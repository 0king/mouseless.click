[package]
name = "mouseless-gtk"
version.workspace = true
edition = "2021"
description = "GTK4/Adwaita settings app over the GTK-free mouseless-config engine."
license = "MIT"

[[bin]]
name = "mouseless-settings"
path = "src/main.rs"

[dependencies]
# The crate is published as `gtk4`; alias it to `gtk` so the UI code reads like
# the GTK documentation and examples.
gtk = { package = "gtk4", version = "0.11" }
libadwaita = { version = "0.9", features = ["v1_5"] }
mouseless-cli = { workspace = true }
mouseless-config = { workspace = true }
mouseless-ipc = { workspace = true }
mouseless-kbd = { workspace = true }
